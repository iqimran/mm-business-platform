# Local development stack. Values come from the root `.env` (see `.env.example`).
name: ${COMPOSE_PROJECT_NAME:-mm-business-platform}

# Shared definition of the Laravel containers (PHP-FPM, scheduler, queue worker).
x-backend: &backend
  build: ./docker/php
  volumes:
    - ./backend:/var/www/html
  # Infrastructure wiring lives here so credentials are defined once (root .env).
  # These override matching keys in backend/.env.
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    # Must exceed the longest job (database backup timeout) so jobs are never run twice.
    REDIS_QUEUE_RETRY_AFTER: 3900
    # Backups: private directory outside the web root (default: backend/storage/app/backups on the host).
    BACKUP_PATH: ${BACKUP_PATH:-/var/www/html/storage/app/backups}
    BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend

  # Laravel scheduler (daily database backup + retention cleanup, see routes/console.php).
  scheduler:
    <<: *backend
    command: php artisan schedule:work

  # Laravel queue worker (manual database backups and other background jobs).
  queue:
    <<: *backend
    command: php artisan queue:work --tries=1 --timeout=3600 --sleep=3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Keep container-built node_modules (Linux binaries) separate from the host.
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
